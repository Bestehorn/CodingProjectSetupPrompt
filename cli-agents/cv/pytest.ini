[pytest]
# Pytest configuration for the CV Customizer Agent Suite.
# Rooted so the test tree lives under cli-agents/cv/tests/. Run with:
#     python -m pytest            (from cli-agents/cv/)
#     python -m pytest cli-agents/cv   (from the repo root)
# No environment variables are read or required by this configuration.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
