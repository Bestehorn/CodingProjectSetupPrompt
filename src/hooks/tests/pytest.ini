# The hook suite's own pytest configuration. Its presence makes this directory the rootdir when the suite is
# run as `python -m pytest .claude/hooks/tests`, so the PROJECT's `addopts` (coverage floors, xdist workers,
# fail-fast) never apply to it: a coverage floor measured over the project's `src/` cannot be met by a suite
# that imports none of it, and under xdist the totals line disappears (measured on two projects).
# No `-q` here: combined with the `-q` a caller usually passes it becomes `-qq`, which hides the totals line.
[pytest]
addopts = -p no:cacheprovider
testpaths = .
