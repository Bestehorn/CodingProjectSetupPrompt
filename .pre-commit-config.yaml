# Pre-commit configuration for THIS repository (the framework's own repository).
#
# The `stages:` field on each hook decides WHEN it runs, and the tracked git hooks in
# `.githooks/` run whole STAGES rather than named ids — so this file is the single source of
# truth for the commit/push split this repository ships in
# `templates/pre-commit-config.yaml.template`:
#
#   pre-commit  ruff, ruff-format, detect-secrets, detect-private-key, bandit   (< 2 s)
#   manual      pytest (the hook suite, the shipped payload tests, the layout guard)
#
# Do not remove the `stages:` keys. Without them pre-commit defaults a hook to the
# pre-commit stage, which is exactly how a slow hook ends up running on every commit.
#
# WHY THERE IS NO pre-push STAGE HERE
#   The template puts mypy at pre-push. This repository has no mypy configuration yet (the
#   self-hosting step adds its pyproject.toml), so mypy is absent and `.githooks/pre-push`
#   simply finds no pre-push-stage hooks to run. Its other job still applies: if CI-OUTAGE
#   MODE is ever declared here (`python scripts/ci_outage_mode.py declare`), it runs the suite
#   at push time.
#
# WHY pytest IS `stages: [manual]`
#   Tests are never a commit gate. This repository has NO CI pipeline of its own yet, so here
#   the suites are run on demand (`python scripts/run_tests.py`, or
#   `pre-commit run --hook-stage manual pytest`) rather than by a pipeline. In a project set
#   up BY these prompts, CI owns it; the shape of the hooks is the same either way, which is
#   the point of dogfooding them here.
#
# Python in this repository lives under `src/` (the shipped hook runtime and payload), `test/`
# and `scripts/`; ruff reads the root `ruff.toml`, and `src/hooks/ruff.toml` for the hooks.
# Prompt/documentation files are untouched by these hooks.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
        exclude: ^(venv/|tmp/|templates/|old/|workspace/)
      - id: ruff-format
        stages: [pre-commit]
        exclude: ^(venv/|tmp/|templates/|old/|workspace/)

  # A pushed credential cannot be un-pushed, so secret detection is the one check that has
  # to be earlier than CI. This repository is full of prompt text describing tokens and
  # credential files, so the baseline is doing real work here: generate it with
  #   detect-secrets scan > .secrets.baseline
  # and re-run that after auditing a legitimate finding.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        stages: [pre-commit]
        exclude: ^(venv/|tmp/|\.secrets\.baseline$)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]

  # Scoped to the shipped Python under src/. The suites are test code (assert is their job).
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-ll]
        stages: [pre-commit]
        files: ^src/
        exclude: ^(src/hooks/tests/|src/payload/test/)

  - repo: local
    hooks:
      # On demand only — CI owns the suite. scripts/run_tests.py runs every suite in one
      # invocation from the repository root.
      - id: pytest
        name: pytest (manual — never a commit gate; runs every suite)
        entry: python scripts/run_tests.py
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
